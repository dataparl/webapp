name: Liens du site
on:
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi, 08:17 à Paris (heure d'été)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/verifier-liens.mjs https://www.dataparl.fr
