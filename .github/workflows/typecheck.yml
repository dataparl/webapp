name: Typecheck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Contrôle des types
        run: npx tsc --noEmit > typecheck.log 2>&1 || echo "ECHEC_TSC" >> typecheck.log
      - name: Publier le journal sur la branche logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c logs
          git add typecheck.log
          git commit -m "journal du contrôle de types"
          git push origin logs --force
